apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calibre-web
  labels:
    app.kubernetes.io/name: calibre-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik-public
  tls:
    - hosts:
        - "books.felix-prasse.de"
      secretName: "calibre-cert"
  rules:
    - host: "books.felix-prasse.de"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: calibre-web
                port:
                  number: 8083
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http
spec:
  parentRefs:
    - name: istio-public
      namespace: istio-system
  hostnames: ["books.felix-prasse.de"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: calibre-web
          port: 8083
