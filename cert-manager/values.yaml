cert-manager:
  config:
    gatewayAPI:
      enabled: true
  crds:
    enabled: true
  extraArgs:
  # Split horizon DNS: https://cert-manager.io/docs/configuration/acme/dns01/#setting-nameservers-for-dns01-self-check
  # Also Lets Encrypt queries the authorative nameservers, so check against those :)
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=ivan.ns.cloudflare.com:53,kara.ns.cloudflare.com:53

trust-manager:
  secretTargets:
    enabled: true
    authorizedSecretsAll: true