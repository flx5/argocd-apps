external-dns:
  provider:
    name: cloudflare
  domainFilters:
    - felix-prasse.de
  policy: upsert-only
  sources:
    - service
    - ingress
    - gateway-grpcroute
    - gateway-httproute
    - gateway-tcproute
    - gateway-tlsroute
    - gateway-udproute
  # split horizon DNS
  # Do not pick up target annotations from public instance
  annotationPrefix: public.external-dns.kubernetes.io/
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-key
          key: apiKey