external-dns:
  provider:
    name: cloudflare
  domainFilters:
    - felix-prasse.de
  policy: upsert-only
  extraArgs:
    - --dry-run
  sources:
    - gateway-httproute
  # split horizon DNS
  # Do not pick up target annotations from public instance
  annotationPrefix: public.external-dns.kubernetes.io/
  env:
    - name: CF_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: cloudflare-api-key
          key: apiKey