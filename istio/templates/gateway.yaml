apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    public.external-dns.kubernetes.io/target: "dyndns.felix-prasse.de"
spec:
  gatewayClassName: istio
  addresses:
    - type: IPAddress
      value: 192.168.2.96
  # TODO Force redirect to tls?
  # TODO Coraza WAF
  listeners:
    - name: http
      hostname: "*.felix-prasse.de"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: "*.felix-prasse.de"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: felix-prasse-de-tls
    - name: git-ssh
      protocol: TCP
      port: 2234
      allowedRoutes:
        kinds:
          - kind: TCPRoute
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gw-options
