apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-public
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.kubernetes.io/target: "dyndns.felix-prasse.de,flx5-nue.duckdns.org"
spec:
  gatewayClassName: istio
  # TODO Force redirect to tls?
  listeners:
    - name: http
      hostname: "*.felix-prasse.de"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      hostname: "*.felix-prasse.de"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: felix-prasse-de-tls